services:
  - type: web
    name: essay
    runtime: python
    buildCommand: |
      apt-get install -y fonts-noto-core fonts-noto-extra fonts-lohit-deva &&
      pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
